[project]
name = "erpmini"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mangoex", email = "mangoex@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
erpmini = "erpmini:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Strict Modular Monolith: No Cross-Module Model Imports"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "app.modules.system",
    "app.modules.inventory",
    "app.modules.purchase",
    "app.modules.mrp",
    "app.modules.sales",
    "app.modules.account",
    "app.modules.hr",
    "app.modules.bot",
]
forbidden_modules = [
    "app.modules.system.models",
    "app.modules.inventory.models",
    "app.modules.purchase.models",
    "app.modules.mrp.models",
    "app.modules.sales.models",
    "app.modules.account.models",
    "app.modules.hr.models",
    "app.modules.bot.models",
]

